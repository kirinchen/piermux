[package]
name = "piermux"
version = "0.1.24"
description = "Cross-platform tmux session GUI — quick attach across multiple hosts"
authors = ["kirin"]
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/kirinchen/piermux"
homepage = "https://github.com/kirinchen/piermux"

[lib]
name = "piermux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.23.1", features = ["v4"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.52.1", features = ["full"] }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
# SSH client(D-47:換回 SPEC §13 指定的 russh;D-6/D-7 當初因 ed25519-dalek pre-release
# 編不過暫用 makiko,上游 3.0.0 正式版已修)。crypto 後端選 ring 而非預設 aws-lc-rs:
# ring 不吃 cmake、Android NDK 交叉編譯路最熟(rustls 生態同款)。
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
tauri-plugin-opener = "2.5.4"
# piermux:// deep link(契約 doc/DEEP_LINK.md)。desktop 有效;Android 的 intent-filter
# 在 gen/ 由 Tauri 產,v0.1.22 不支援,見契約 §9。
tauri-plugin-deep-link = "2"

# single-instance 只有桌面有意義(mobile 沒有第二個 process),且無 mobile 版 ——
# 放 target 區塊,Android build 不會碰到它。`deep-link` feature 讓第二個 process 收到的
# URL 轉交 deep-link plugin,熱啟動因此跟冷啟動同一條路。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
